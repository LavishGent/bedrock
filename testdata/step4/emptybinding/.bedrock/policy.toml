# Step 4 fixture policy: restrict_concept_to_boundary only.
version = 1
module = "example.com/s4/emptybinding"

[boundary.all]
packages = ["example.com/s4/emptybinding/**"]

[boundary.repo]
packages = ["example.com/s4/emptybinding/repo/**"]

[concept."db.custom"]
symbols = ["example.com/s4/emptybinding/repo.Missing"]

[[rule]]
id = "db-in-repo"
kind = "restrict_concept_to_boundary"
scope = "all"
concept = "db.custom"
boundary = "repo"
message = "Database queries must run inside repo."
remediation.message = "Move the query into example.com/s4/emptybinding/repo."
